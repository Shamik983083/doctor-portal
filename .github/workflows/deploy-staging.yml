name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging.axismd.io
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/axismd/public_html/staging_doctor_portal

            echo "--- Ensuring remote points to correct repo with auth ---"
            git remote set-url origin https://Shamik983083:${{ secrets.DEPLOY_TOKEN }}@github.com/INV2025/MEDAXIS-DOCTOR.git

            echo "--- Pulling latest code ---"
            git fetch origin staging
            git reset --hard origin/staging

            echo "--- Installing dependencies ---"
            /opt/cpanel/ea-php82/root/usr/bin/php composer.phar install --no-dev --optimize-autoloader --no-interaction

            echo "--- Running migrations ---"
            /opt/cpanel/ea-php82/root/usr/bin/php artisan migrate --force

            echo "--- Seeding: foundational data (idempotent, safe to re-run) ---"
            # All seeders below use firstOrCreate / updateOrCreate / syncWithoutDetaching
            # so they are safe to run on every deploy. DemoDataSeeder is deliberately
            # excluded — it inserts fake records and must never run in CI pipelines.
            # StagingPreviewSeeder is staging-only and runs last so roles/offerings exist.
            PHP=/opt/cpanel/ea-php82/root/usr/bin/php

            $PHP artisan db:seed --class="Database\\Seeders\\RolesAndPermissionsSeeder"   --force
            $PHP artisan db:seed --class="Database\\Seeders\\IntakeQuestionnairesSeeder"  --force
            $PHP artisan db:seed --class="Database\\Seeders\\OfferIntakeQuestionnairesSeeder" --force
            $PHP artisan db:seed --class="Database\\Seeders\\NadQuestionnaireSeeder"      --force
            $PHP artisan db:seed --class="Database\\Seeders\\OfferingCategoriesSeeder"    --force
            $PHP artisan db:seed --class="Database\\Seeders\\GlpOfferingsSeeder"          --force
            $PHP artisan db:seed --class="Database\\Seeders\\NadOfferingsSeeder"          --force
            $PHP artisan db:seed --class="Database\\Seeders\\AttachQuestionnairesToOfferingsSeeder" --force
            $PHP artisan db:seed --class="Database\\Seeders\\PartnerProductPlanSeeder"    --force
            $PHP artisan db:seed --class="Database\\Seeders\\SettingsSeeder"              --force
            $PHP artisan db:seed --class="Database\\Seeders\\AiInstructionSetsSeeder"     --force

            echo "--- Seeding: staging preview data (staging-only) ---"
            $PHP artisan db:seed --class="Database\\Seeders\\StagingPreviewSeeder"        --force

            echo "--- Clearing and rebuilding caches ---"
            /opt/cpanel/ea-php82/root/usr/bin/php artisan config:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan route:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan view:cache

            echo "--- Restarting queue workers ---"
            # Production had this; staging did not, so staging workers ran stale
            # code against new schema after every deploy. Fixed here.
            /opt/cpanel/ea-php82/root/usr/bin/php artisan queue:restart

            echo "--- Deployment complete ---"
